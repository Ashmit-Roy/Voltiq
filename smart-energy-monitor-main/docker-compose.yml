version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smart-energy-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smart_energy.db
      - PORT=8000
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: smart-energy-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
